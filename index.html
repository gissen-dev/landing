<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Gissen — The headless visual editor for Vue</title>
    <meta
      name="description"
      content="Gissen is an open-source, MIT-licensed headless visual editor for Vue. Drag and drop your existing Vue components to build pages, marketing sites, or your own CMS. Self-hosted and agent-ready."
    />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="canonical" href="https://gissen.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gissen" />
    <meta property="og:url" content="https://gissen.dev/" />
    <meta property="og:title" content="Gissen — The headless visual editor for Vue" />
    <meta
      property="og:description"
      content="Drag and drop your Vue components to build pages, marketing sites, or your own CMS. Open source, MIT, self-hosted."
    />
    <!-- TODO: add a 1200×630 social image at /og.png and uncomment -->
    <!-- <meta property="og:image" content="https://gissen.dev/og.png" /> -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gissen — The headless visual editor for Vue" />
    <meta
      name="twitter:description"
      content="Drag and drop your Vue components to build pages, marketing sites, or your own CMS. Open source, MIT, self-hosted."
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Gissen",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "Open-source headless visual editor for Vue. Drag and drop your Vue components to build pages, marketing sites, or your own CMS.",
        "url": "https://gissen.dev/",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
